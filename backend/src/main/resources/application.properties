spring.application.name=a11yforge

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/a11yforge?stringtype=unspecified
spring.datasource.username=a11yforge

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- Scanner ---
scanner.cli.path=../scanner/dist/cli.js
scanner.timeout.seconds=120

# --- Scan ---
a11yforge.scan.max-concurrent=3

# --- Verifier ---
verifier.cli.path=../scanner/dist/cli-verify.js
verifier.timeout.seconds=120

# --- LLM ---
a11yforge.llm.default-provider=ANTHROPIC
a11yforge.llm.prompt-version=v1

# Anthropic
a11yforge.llm.anthropic.model=claude-sonnet-4-6

# Ollama
a11yforge.llm.ollama.base-url=http://localhost:11434
a11yforge.llm.ollama.model=qwen2.5-coder:7b

# Mail (Mailtrap)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password reset
a11yforge.mail.from=no-reply@a11yforge.local
a11yforge.frontend.base-url=http://localhost:5173

# JWT
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
