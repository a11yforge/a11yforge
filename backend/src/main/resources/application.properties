spring.application.name=a11yforge

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/a11yforge
spring.datasource.username=a11yforge

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- Scanner ---
scanner.cli.path=../scanner/dist/cli.js
scanner.timeout.seconds=120

# --- LLM ---
a11yforge.llm.default-provider=NONE
a11yforge.llm.prompt-version=v1

# Anthropic
a11yforge.llm.anthropic.model=claude-sonnet-4-6

# Ollama
a11yforge.llm.ollama.base-url=http://localhost:11434
a11yforge.llm.ollama.model=qwen2.5-coder:7b