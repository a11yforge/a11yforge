spring.application.name=a11yforge

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/a11yforge
spring.datasource.username=a11yforge

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- Scanner ---
scanner.cli.path=../scanner/dist/cli.js
scanner.timeout.seconds=120

# --- JWT ---
jwt.expiration-ms=86400000