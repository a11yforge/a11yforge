$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"identifier\": \"{{testIdentifier}}\",\r

    \    \"password\": \"{{testPassword}}\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response contains token, email, and userName\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json).to.have.property(\"token\");\r

      \    pm.expect(json).to.have.property(\"email\");\r

      \    pm.expect(json).to.have.property(\"userName\");\r

      \    pm.expect(json.token).to.be.a(\"string\").and.not.empty;\r

      });\r

      \r

      pm.test(\"Token saved to environment\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.environment.set(\"jwtToken\", json.token);\r

      \    pm.expect(pm.environment.get(\"jwtToken\")).to.equal(json.token);\r

      });"
    language: text/javascript
order: 2000
